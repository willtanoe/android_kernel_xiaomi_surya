name: Build Kernel and Release

on:
  push:
    branches:
      - avalanche
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release after both builds pass
        required: true
        default: false
        type: boolean

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      DATE: ${{ steps.setdate.outputs.DATE }}
    steps:
      - id: setdate
        run: |
          echo "DATE=$(TZ=Asia/Jakarta date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

  build_kernel:
    name: Build Kernel and Release
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        include:
          - root: "KSU"
          - root: "NoKSU"

    steps:
    - name: Checkout Source
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Set environment
      run: |
        echo "ROOT=${{ matrix.root }}" >> $GITHUB_ENV
        echo "DATE=${{ needs.prepare.outputs.DATE }}" >> $GITHUB_ENV
        echo "ARTIFACT=$GITHUB_WORKSPACE/artifact" >> $GITHUB_ENV

    - name: Building
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache device-tree-compiler
        mkdir -p ${{ env.ARTIFACT }}
        chmod +x build.sh && ./build.sh ${{ env.ROOT }} ${{ env.DATE }} ${{ env.ARTIFACT }}

    - name: Upload artifact
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      with:
        name: Avalanche-${{ env.ROOT }}-${{ env.DATE }}
        path: ${{ env.ARTIFACT }}/*

  create_release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [prepare, build_kernel]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set DATE and TAG
        run: |
          echo "TAG=Avalanche-${{ needs.prepare.outputs.DATE }}-${GITHUB_SHA:0:8}" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifact
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum artifact/*.zip > artifact/SHA256SUMS

      - name: Create Git tag
        run: |
          git tag -a "$TAG" -m "Avalanche build ${GITHUB_SHA}"
          git push origin "$TAG"

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          files: artifact/*
          body: |
            ## Avalanche Kernel

            - Device target: POCO X3 NFC (`surya`)
            - Source commit: `${{ github.sha }}`
            - Kernel: Linux 4.14.357 OpenELA
            - Toolchain: AOSP Clang 21.0.0 (build 13289611)
            - Variants: KernelSU and NoKSU

            ### Changes

            https://github.com/willtanoe/android_kernel_xiaomi_surya/commits/avalanche

            ### Validation

            Both variants passed compile, configuration, packaging, and ZIP integrity checks. Runtime device testing is still required; successful compilation does not guarantee ROM or hardware compatibility.

            Verify downloads against the attached `SHA256SUMS` file. Keep a known recovery path and a backup of boot-related partitions before flashing.
